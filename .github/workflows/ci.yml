name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests benchmarks lambdas infra
      - run: pytest -q
      - name: End-to-end run on sample data
        run: python -m clinicalflow.pipeline --no-s3
        env:
          PYTHONPATH: src
          RAW_DIR: data/sample
